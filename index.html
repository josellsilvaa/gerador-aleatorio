<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senha Forte</title>
  <meta name="description" content="Gerador de senhas aleatórias e seguras com 12 caracteres.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .password-box {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.5rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .password-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    .password-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .copy-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .generate-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 20px -5px var(--primary-glow);
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .generate-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px var(--primary-glow);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      opacity: 0;
      background: #10b981;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Gerador de Senhas</h1>
    <p class="subtitle">Gere senhas fortes e aleatórias de 12 caracteres com apenas um clique.</p>

    <div class="password-box">
      <input type="text" id="passwordDisplay" class="password-input" readonly placeholder="Clique em Gerar">
      <button id="copyBtn" class="copy-btn" title="Copiar Senha">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>

    <button id="generateBtn" class="generate-btn">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
      </svg>
      Gerar Senha
    </button>
  </main>

  <div id="toast" class="toast">Senha copiada com sucesso!</div>

  <script>
    const passwordInput = document.getElementById('passwordDisplay');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    function generateStrongPassword(length = 12) {
      const lowercase = 'abcdefghijklmnopqrstuvwxyz';
      const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const numbers = '0123456789';
      const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
      const allChars = lowercase + uppercase + numbers + symbols;

      const getRandomChar = (str) => {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return str[array[0] % str.length];
      };

      const required = [
        getRandomChar(lowercase),
        getRandomChar(uppercase),
        getRandomChar(numbers),
        getRandomChar(symbols)
      ];

      for (let i = 4; i < length; i++) {
        required.push(getRandomChar(allChars));
      }

      // Embaralhar o vetor (Fisher-Yates) utilizando Criptografia Segura
      for (let i = required.length - 1; i > 0; i--) {
        const rand = new Uint32Array(1);
        window.crypto.getRandomValues(rand);
        const j = rand[0] % (i + 1);
        [required[i], required[j]] = [required[j], required[i]];
      }

      return required.join('');
    }

    function renderPassword() {
      const pwd = generateStrongPassword(12);
      passwordInput.value = pwd;
    }

    generateBtn.addEventListener('click', renderPassword);

    copyBtn.addEventListener('click', () => {
      if (!passwordInput.value) return;
      navigator.clipboard.writeText(passwordInput.value).then(() => {
        showToast();
      }).catch(err => {
        // Fallback se navigator.clipboard falhar
        passwordInput.select();
        document.execCommand('copy');
        showToast();
      });
    });

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Gerar uma senha automaticamente ao abrir a página
    renderPassword();
  </script>
</body>
</html>
